apiVersion: v1
kind: Namespace
metadata:
  name: happy-wakey
  labels:
    app.kubernetes.io/part-of: happy-wakey
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: happy-wakey-api
  namespace: happy-wakey
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: happy-wakey-web
  namespace: happy-wakey
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: happy-wakey-runtime
  namespace: happy-wakey
data:
  HAPPY_WAKEY_SHARED_AUTH_BASE: https://auth.oresoftware.dev
  HAPPY_WAKEY_SHARED_AUTH_AUDIENCE: happy-wakey
  HAPPY_WAKEY_API_BASE: https://api.happy-wakey.internal
  HAPPY_WAKEY_API_TCP_BIND: 0.0.0.0:8081
  HAPPY_WAKEY_API_TCP_ADDRESS: happy-wakey-api.happy-wakey.svc.cluster.local:8081
  HAPPY_WAKEY_API_TCP_SERVER_NAME: happy-wakey-api.happy-wakey.svc.cluster.local
  HAPPY_WAKEY_API_TCP_TLS_CERT: /var/run/secrets/happy-wakey/api-tls/tls.crt
  HAPPY_WAKEY_API_TCP_TLS_KEY: /var/run/secrets/happy-wakey/api-tls/tls.key
  HAPPY_WAKEY_API_TCP_CA_FILE: /var/run/secrets/happy-wakey/api-tls/ca.crt
  HAPPY_WAKEY_INTERACTION_MODE: stateless_https
  HAPPY_WAKEY_DATABASE_FLAVOR: postgres
  HAPPY_WAKEY_DATABASE_MAX_CONNECTIONS: '4'
  HAPPY_WAKEY_NATS_URL: tls://nats.happy-wakey.svc.cluster.local:4222
  HAPPY_WAKEY_NATS_CREDENTIALS_FILE: /var/run/secrets/happy-wakey/nats/credentials.creds
  HAPPY_WAKEY_NATS_REQUEST_STREAM: HAPPY_WAKEY_OPERATIONS
  HAPPY_WAKEY_NATS_RESPONSE_STREAM: HAPPY_WAKEY_RESPONSES
  HAPPY_WAKEY_NATS_CONSUMER: happy-wakey-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: happy-wakey-api
  namespace: happy-wakey
  labels:
    app.kubernetes.io/name: happy-wakey-api
    app.kubernetes.io/part-of: happy-wakey
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: happy-wakey-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: happy-wakey-api
        app.kubernetes.io/part-of: happy-wakey
    spec:
      serviceAccountName: happy-wakey-api
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/happy-wakey/happy-wakey-api-server.rs:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: tcp
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: happy-wakey-runtime
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: happy-wakey-api-runtime
                  key: database-url
            - name: HAPPY_WAKEY_SHARED_AUTH_INTROSPECT_SECRET
              valueFrom:
                secretKeyRef:
                  name: happy-wakey-api-runtime
                  key: shared-auth-introspect-secret
          volumeMounts:
            - name: api-tls
              mountPath: /var/run/secrets/happy-wakey/api-tls
              readOnly: true
            - name: api-nats
              mountPath: /var/run/secrets/happy-wakey/nats
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 512Mi
      volumes:
        - name: api-tls
          secret:
            secretName: happy-wakey-api-tls
            defaultMode: 0400
        - name: api-nats
          secret:
            secretName: happy-wakey-api-nats
            defaultMode: 0400
            items:
              - key: credentials
                path: credentials.creds
---
apiVersion: v1
kind: Service
metadata:
  name: happy-wakey-api
  namespace: happy-wakey
spec:
  selector:
    app.kubernetes.io/name: happy-wakey-api
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: tcp
      port: 8081
      targetPort: tcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: happy-wakey-web
  namespace: happy-wakey
  labels:
    app.kubernetes.io/name: happy-wakey-web
    app.kubernetes.io/part-of: happy-wakey
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: happy-wakey-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: happy-wakey-web
        app.kubernetes.io/part-of: happy-wakey
    spec:
      serviceAccountName: happy-wakey-web
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/happy-wakey/happy-wakey-web-server.rs:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8131
          envFrom:
            - configMapRef:
                name: happy-wakey-runtime
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: happy-wakey-web-runtime
                  key: database-read-url
            - name: HAPPY_WAKEY_SHARED_AUTH_INTROSPECT_SECRET
              valueFrom:
                secretKeyRef:
                  name: happy-wakey-web-runtime
                  key: shared-auth-introspect-secret
          volumeMounts:
            - name: api-tls
              mountPath: /var/run/secrets/happy-wakey/api-tls
              readOnly: true
            - name: web-nats
              mountPath: /var/run/secrets/happy-wakey/nats
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 512Mi
      volumes:
        - name: api-tls
          secret:
            secretName: happy-wakey-api-tls
            defaultMode: 0400
            items:
              - key: ca.crt
                path: ca.crt
        - name: web-nats
          secret:
            secretName: happy-wakey-web-nats
            defaultMode: 0400
            items:
              - key: credentials
                path: credentials.creds
---
apiVersion: v1
kind: Service
metadata:
  name: happy-wakey-web
  namespace: happy-wakey
spec:
  selector:
    app.kubernetes.io/name: happy-wakey-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: happy-wakey
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: happy-wakey-api
  namespace: happy-wakey
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: happy-wakey-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: happy-wakey-web
  namespace: happy-wakey
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: happy-wakey-web
